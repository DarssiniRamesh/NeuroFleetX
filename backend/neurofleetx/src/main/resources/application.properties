spring.application.name=neurofleetx

# SQLite datasource (embedded, file-based)
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:${NEUROFLEETX_SQLITE_PATH:./data/neurofleetx.db}
spring.datasource.username=
spring.datasource.password=

# Hibernate / JPA configuration for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ensure Spring runs our seed script on startup (after Hibernate has not attempted DDL)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=classpath:db/seed-sqlite.sql

# Server
# Default to the preview port used by this project/container.
server.port=3001

# Actuator (used by Playwright webServer readiness checks in CI)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

